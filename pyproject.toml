[project]
name = "novawealth-voice-agent"
version = "1.0.0"
description = "Bilingual voice investor-support agent with RAG and MCP tools"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: spawns the real MCP server subprocess (no network needed)"]
